name: Build & publish Docker image

# Every push to main builds a new image and publishes it to GitHub Container Registry.
# Servers running docker-compose.yml pick it up automatically via Watchtower.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Type-check
        run: |
          npm ci --no-audit --no-fund
          npm run lint

      - name: Image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional instant deploy: if the server exposes Watchtower's HTTP API, trigger an update now
      # instead of waiting for the next poll. Set repository secrets WATCHTOWER_URL and WATCHTOWER_TOKEN.
      - name: Trigger Watchtower update (optional)
        if: github.ref == 'refs/heads/main'
        env:
          WATCHTOWER_URL: ${{ secrets.WATCHTOWER_URL }}
          WATCHTOWER_TOKEN: ${{ secrets.WATCHTOWER_TOKEN }}
        run: |
          if [ -n "$WATCHTOWER_URL" ] && [ -n "$WATCHTOWER_TOKEN" ]; then
            curl -fsS -m 30 -H "Authorization: Bearer $WATCHTOWER_TOKEN" "$WATCHTOWER_URL/v1/update" && echo "Watchtower update triggered"
          else
            echo "WATCHTOWER_URL/WATCHTOWER_TOKEN not set — the server will pick up the new image on its next poll."
          fi
